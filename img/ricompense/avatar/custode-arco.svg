<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Il Custode, chiave e arco">
  <title>Il Custode — chiave e arco</title>
  <defs>
    <clipPath id="cb-c"><circle cx="64" cy="64" r="64"/></clipPath>
  </defs>
  <g clip-path="url(#cb-c)">
