      <circle cx="0" cy="-16" r="6.5" fill="none" stroke="#fff6d4" stroke-width="3.2"/>
      <rect x="-4" y="-2" width="8" height="48" rx="2.5" fill="#f2b134"/>
      <rect x="-4" y="38" width="20" height="8" rx="2" fill="#f2b134"/>
      <rect x="-4" y="26" width="14" height="8" rx="2" fill="#f2b134"/>
    </g>
  </g>
</svg>
